name: Dependabot auto-merge

# Activa el auto-merge de la PR agrupada de security updates de uv
# (dependabot.yml, grupo `security`): GitHub la mergea cuando pasan los checks
# que exige la proteccion de main (checks, image, test). El resto de PRs de
# Dependabot (minor/patch mensual, majors) siguen esperando revision.
#
# El merge lo hace GITHUB_TOKEN, y un push de GITHUB_TOKEN no dispara CI en
# main: el deploy de ese merge lo recoge el job `redeploy` del Nightly.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: steps.metadata.outputs.dependency-group == 'security'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
