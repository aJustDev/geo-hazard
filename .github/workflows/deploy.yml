name: Deploy

# Se dispara cuando el workflow `CI` termina sobre `main`.
# `conclusion == 'success'` aborta si CI fue rojo: el deploy nunca recibe un
# commit que rompe lint/tests. La variable GEOHAZARD_DEPLOY_ENABLED es el
# interruptor general: en 'false' hasta que el DNS y el servidor esten listos.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Lo lanza el job `redeploy` del Nightly. Una CI lanzada con GITHUB_TOKEN
  # (la del redeploy) no dispara `workflow_run`, asi que Deploy no la seguiria
  # solo: paso el 2026-11-16 con el primer auto-merge de Dependabot.
  workflow_dispatch:

concurrency:
  group: deploy-geohazard
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.GEOHAZARD_DEPLOY_ENABLED == 'true'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      # Por workflow_dispatch no hay `workflow_run` que diga como acabo la CI:
      # se comprueba aqui, para que tampoco asi llegue un commit en rojo.
      - name: CI en verde para este commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId -q length)"
          if [ "$ok" -eq 0 ]; then
            echo "::error::$GITHUB_SHA no tiene CI en verde: no se despliega"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GEOHAZARD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${{ secrets.GEOHAZARD_DEPLOY_PORT }}" \
            "${{ secrets.GEOHAZARD_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger deploy
        # No se pasa comando: la clave esta restringida en el servidor a un
        # unico script de deploy, asi que SSH lo ejecuta y devuelve su exit code.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.GEOHAZARD_DEPLOY_PORT }}" \
            "${{ secrets.GEOHAZARD_DEPLOY_USER }}@${{ secrets.GEOHAZARD_DEPLOY_HOST }}"

      - name: Smoke test (publico via reverse proxy)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null https://geohazard.ajustino.dev/v1/health/liveness; then
              echo "OK on attempt $i"
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: liveness no respondio en 30s"
          exit 1
