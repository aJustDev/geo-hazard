name: Nightly

# Fuera de `CI` a proposito: Deploy solo escucha a CI, asi que este workflow
# no despliega lo que audita. Detecta lo que cambia sin que haya push: CVEs
# publicados despues del ultimo lock y cambios de contrato de los upstreams.
# Su unico efecto es `redeploy`: lanzar CI sobre un main que se quedo sin el.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  # Formato real de EFFIS, IGN y AEMET (tests/contract). Una fuente caida salta
  # su test; solo un cambio de contrato pone el job en rojo. Sin el secret, el
  # test de AEMET se salta.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Contract tests (upstreams reales)
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: uv run pytest -m contract -v

  # El auto-merge de Dependabot lo hace GITHUB_TOKEN, cuyo push no dispara CI
  # en main y por tanto tampoco Deploy. Si el ultimo commit de main no tiene
  # CI, se lanza aqui (workflow_dispatch si dispara), y Deploy lo sigue.
  redeploy:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: CI sobre main si su ultimo commit no lo tiene
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(gh api "repos/$REPO/commits/main" -q .sha)"
          runs="$(gh run list -R "$REPO" --workflow ci.yml --commit "$sha" --json databaseId -q length)"
          if [ "$runs" -eq 0 ]; then
            echo "main@$sha sin CI: se lanza"
            gh workflow run ci.yml -R "$REPO" --ref main
          fi
