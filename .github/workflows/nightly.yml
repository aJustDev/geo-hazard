name: Nightly

# Fuera de `CI` a proposito: Deploy solo escucha a CI, asi que este workflow
# no despliega lo que audita. Detecta lo que cambia sin que haya push: CVEs
# publicados despues del ultimo lock y cambios de contrato de los upstreams.
# Su unico efecto es `redeploy`: lanzar CI sobre un main que se quedo sin el.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  # Formato real de EFFIS, IGN y AEMET (tests/contract). Una fuente caida salta
  # su test; solo un cambio de contrato pone el job en rojo. Sin el secret, el
  # test de AEMET se salta.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Contract tests (upstreams reales)
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: uv run pytest -m contract -v

  # El auto-merge de Dependabot lo hace GITHUB_TOKEN, cuyo push no dispara CI
  # en main y por tanto tampoco Deploy. Si el ultimo commit de main no esta
  # desplegado, se le pasa la CI si no la tiene en verde y se lanza Deploy,
  # los dos con workflow_dispatch: es lo unico que GITHUB_TOKEN si dispara.
  # Una CI lanzada asi no encadena Deploy por `workflow_run` (2026-11-16).
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Desplegar main si su ultimo commit no lo esta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/commits/main" -q .sha)"
          deployed="$(gh run list -R "$REPO" --workflow deploy.yml --commit "$sha" --status success --json databaseId -q length)"
          if [ "$deployed" -gt 0 ]; then
            echo "main@$sha ya desplegado"
            exit 0
          fi
          ci_ok="$(gh run list -R "$REPO" --workflow ci.yml --commit "$sha" --status success --json databaseId -q length)"
          if [ "$ci_ok" -eq 0 ]; then
            echo "main@$sha sin CI en verde: se lanza"
            gh workflow run ci.yml -R "$REPO" --ref main
            id=""
            for _ in $(seq 1 30); do
              id="$(gh run list -R "$REPO" --workflow ci.yml --commit "$sha" --event workflow_dispatch \
                --json databaseId,status -q '[.[] | select(.status != "completed")][0].databaseId // empty')"
              [ -n "$id" ] && break
              sleep 5
            done
            if [ -z "$id" ]; then
              echo "::error::no aparece la CI lanzada para main@$sha"
              exit 1
            fi
            gh run watch "$id" -R "$REPO" --exit-status > /dev/null
          fi
          echo "main@$sha sin desplegar: se lanza Deploy"
          gh workflow run deploy.yml -R "$REPO" --ref main
