version: 2
updates:
  # Minor y patch en una sola PR mensual; las majors llegan en PRs sueltas para
  # revisarlas una a una. Los CVEs los vigila aparte el workflow Nightly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
