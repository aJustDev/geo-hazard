version: 2
updates:
  # Minor y patch en una sola PR mensual; las majors llegan en PRs sueltas para
  # revisarlas una a una. Los CVEs los vigila aparte el workflow Nightly.
  #
  # Las security updates, todas en UNA PR: sueltas (una por paquete) nunca
  # salen verdes, porque pip-audit y trivy tumban cada una por los CVEs que
  # arreglan las demas. Esa PR la mergea sola dependabot-automerge.yml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
